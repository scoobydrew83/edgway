# Edgway's demo gateway as a decK file (tools/kong-compat-e2e.sh seeds and
# checks it). Apply with `deck gateway sync examples/deck/demo.yaml`.
# The seed API key is not included: key-auth keys are stored hashed and
# issued through the admin API.
_format_version: "3.0"
services:
  - name: httpbin-anything
    url: https://httpbin.org/anything
    routes:
      - name: httpbin-get
        paths:
          - /demo/httpbin
        methods:
          - GET
          - POST
        strip_path: true
        plugins:
          - name: key-auth
            config:
              key_names:
                - X-Api-Key
              hide_credentials: true
          - name: rate-limiting
            config:
              minute: 30
              limit_by: ip
              policy: local
          - name: proxy-cache
            config:
              strategy: memory
              cache_ttl: 30
  - name: httpbin-ip
    url: https://httpbin.org/ip
    routes:
      - name: public-ip
        paths:
          - /demo/ip
        methods:
          - GET
        strip_path: true
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              limit_by: ip
              policy: local
          - name: proxy-cache
            config:
              strategy: memory
              cache_ttl: 10
consumers:
  - username: dev-seed
